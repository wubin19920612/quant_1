[project]
name = "btc-options-monitor"
version = "0.1.0"
description = "Terminal-based BTC options IV/RV monitoring tool"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.50",
    "textual-plotext>=0.2",
    "websockets>=12.0",
    "scipy>=1.12",
    "numpy>=1.26",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
btc-monitor = "src.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
